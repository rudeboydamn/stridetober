<!doctype html>
<!-- App icon. Scales with the viewport: screenshot at 512×512, 192×192 and 180×180
     → public/icon-512.png, icon-192.png, apple-touch-icon.png. Full-bleed square
     (iOS and Android apply their own corner masks); artwork stays in the 80% safe zone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700,100&display=block">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden}
  body{display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#EC8A45 0%,#E0661B 55%,#C9561A 100%)}
  .mark{position:relative;width:62vw;height:62vw}
  .mark svg{position:absolute;inset:0;width:100%;height:100%;fill:#FBF5EA;transform:rotate(-8deg)}
  .mark span{position:absolute;left:0;right:0;top:25%;text-align:center;color:#C9561A;font:700 25vw/1 Fraunces;font-variation-settings:"SOFT" 100}
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 24 24"><path d="M12 1.2l1.7 3.6 2.4-1.2-.5 4.9 3.4-2.6.8 2.2 3-.5-1.5 3.5 1.5 1.2-4.9 4 .8 2.2-5-.9-.8 4.4H11l-.8-4.4-5 .9.8-2.2-4.9-4 1.5-1.2L1.1 8.1l3 .5.8-2.2 3.4 2.6-.5-4.9 2.4 1.2z"/><path d="M11.4 18.5h1.2V23h-1.2z"/></svg>
    <span>S</span>
  </div>
</body>
</html>
