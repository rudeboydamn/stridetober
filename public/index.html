<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF5EA">
<title>Stridetober</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍂</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600..700,100,0;1,9..144,600..700,100,1&family=Inter:wght@400..700&family=Caveat:wght@600&display=swap">
<style>
  /* PLACEHOLDER — Task 2 replaces this with styles/*.css per docs/PLAN.md §3. */
  :root{--bg:#FBF5EA;--surface:#FFFDF8;--line:#E7D8C2;--ink:#2A1C13;--ink-2:#5E4838;--accent-ink:#A6420E;--ribbon:#5F6F2E;--on-ribbon:#FBF5EA}
  *{box-sizing:border-box}html{overflow-x:clip;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif}
  .card{max-width:34rem;margin:24px;padding:48px 32px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px}
  .ribbon{display:inline-block;background:var(--ribbon);color:var(--on-ribbon);font:700 12px Inter;letter-spacing:.16em;text-transform:uppercase;padding:6px 20px;transform:rotate(-1.5deg);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%,10px 50%)}
  h1{font:600 clamp(2.75rem,8vw,4.5rem)/1.04 Fraunces,serif;letter-spacing:-.01em;margin:18px 0 6px}
  h1 em{color:var(--accent-ink)}
  .dates{font:600 19px Fraunces,serif;color:var(--ink-2);margin:0 0 18px}
  .note{font:600 24px Caveat,cursive;color:var(--accent-ink);transform:rotate(-2deg);display:inline-block}
  .fine{font-size:12px;color:var(--ink-2);margin-top:28px}
</style>
</head>
<body>
<main class="card">
  <span class="ribbon">October Steps Challenge</span>
  <h1>Stride<em>tober</em></h1>
  <p class="dates">October 4 – November 1</p>
  <span class="note">the leaves are gathering…</span>
  <p class="fine">Walk it. Track it. Win it! · The Judge is <em>fairly</em> ready.</p>
</main>
</body>
</html>
